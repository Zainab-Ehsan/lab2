<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .team {
            margin-top: 30px;
        }

        .team h2 {
            color: #444;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>About Our Company</h1>

        <p>
            Welcome to our website. We are a team of passionate developers
            who build modern and user-friendly software applications.
        </p>

        <div class="team">
            <h2>Our Mission</h2>

            <p>
                Our mission is to create simple, reliable and innovative
                technology solutions that make people's lives easier.
            </p>
        </div>

        <button>Learn More</button>

    </div>

</body>
</html>
